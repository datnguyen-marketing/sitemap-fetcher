<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap URL Fetcher</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Sitemap URL Fetcher</h1>
    <form id="sitemapForm">
        <label for="sitemapUrl">Enter Sitemap URL:</label>
        <input type="url" id="sitemapUrl" placeholder="https://example.com/sitemap.xml" required>
        <button type="submit">Fetch URLs</button>
    </form>
    <div id="results"></div>
</body>
</html>
